name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no dependencies)
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -t tests -v
      - name: Install and smoke-test the entry point
        run: |
          python -m pip install .
          tailslip --version
          tailslip doctor
